name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLIBOPENCAD_TEST_UPSTREAM=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Stage 8 package and drawing-variable tests
        run: ctest --test-dir build -R '^(stage8_drawing_vars|stage8_find_package)$' --output-on-failure
